name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 只需要读仓库
permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # 这个包零运行时依赖（vite 只是可选 peer），所以不需要 npm install。
      # 测试里跑的 examples 也是自包含的 —— 端到端测试用页面模拟器代替真 WPS。
      - name: 跑测试
        run: npm test
